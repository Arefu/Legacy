name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "build-${{ github.run_id }}"
            echo "IS_TRANSIENT=true" >> $env:GITHUB_ENV
          } else {
            $tag = "${{ github.ref_name }}"
            echo "IS_TRANSIENT=false" >> $env:GITHUB_ENV
          }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore DBZKit
        run: dotnet restore DBZKit/DBZKit/DBZKit.csproj

      - name: Restore Dragon Radar
        run: dotnet restore "DBZKit/Dragon Radar/Dragon Radar.csproj"

      - name: Restore Legacy
        run: dotnet restore DBZKit/Legacy/Legacy.csproj

      - name: Publish DBZKit
        run: dotnet publish DBZKit/DBZKit/DBZKit.csproj -c Release -p:Platform=x86 -r win-x86 --self-contained false -o publish/release

      - name: Publish Dragon Radar
        run: dotnet publish "DBZKit/Dragon Radar/Dragon Radar.csproj" -c Release -o publish/release

      - name: Publish Legacy
        run: dotnet publish DBZKit/Legacy/Legacy.csproj -c Release -p:Platform=x86 -r win-x86 --self-contained false -o publish/release

      - name: Zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path publish/release/* -DestinationPath DBZKit-${{ env.RELEASE_TAG }}.zip

      - name: Clean up previous transient release
        if: env.IS_TRANSIENT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release delete ${{ env.RELEASE_TAG }} --yes --cleanup-tag 2>$null
          exit 0

      - name: Create GitHub Release (transient)
        if: env.IS_TRANSIENT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ env.RELEASE_TAG }} `
            DBZKit-${{ env.RELEASE_TAG }}.zip `
            --title "${{ env.RELEASE_TAG }}" `
            --generate-notes `
            --prerelease

      - name: Create GitHub Release (versioned)
        if: env.IS_TRANSIENT == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ env.RELEASE_TAG }} `
            DBZKit-${{ env.RELEASE_TAG }}.zip `
            --title "${{ env.RELEASE_TAG }}" `
            --generate-notes
