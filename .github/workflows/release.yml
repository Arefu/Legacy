name: Release

# Push a tag like v1.0.5 and this builds DBZKit, Dragon Radar and Legacy and attaches them to a GitHub Release for that
# tag -- no binaries need to be built or uploaded by hand. "Run workflow" on the Actions tab makes a throwaway
# prerelease (build-<run id>) to try a build without tagging.
#
#   git tag v1.0.5
#   git push origin v1.0.5

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "build-${{ github.run_id }}"
            echo "IS_TRANSIENT=true" >> $env:GITHUB_ENV
          } else {
            $tag = "${{ github.ref_name }}"
            echo "IS_TRANSIENT=false" >> $env:GITHUB_ENV
          }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # One build of the whole solution, exactly what Visual Studio / a local `dotnet build` makes. All three apps land in
      # DBZKit/Build/Release (Directory.Build.props) with one copy of each shared DLL. The old workflow published each app
      # separately into one folder -- Dragon Radar as AnyCPU, the others as x86 -- so the shared DrGero/Bulma DLLs of one
      # overwrote the others' with a mismatched build.
      - name: Build
        run: dotnet build DBZKit/DBZKit.slnx -c Release -p:Platform=x86

      - name: Zip
        shell: pwsh
        run: |
          $out = "DBZKit/Build/Release"
          foreach ($exe in "DBZKit.exe", "Dragon Radar.exe", "Legacy.exe", "JCALG1.dll") {
            if (-not (Test-Path (Join-Path $out $exe))) { throw "Build output is missing $exe" }
          }
          # Debug symbols stay out of the download.
          Get-ChildItem $out -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path "$out/*" -DestinationPath "DBZKit-${{ env.RELEASE_TAG }}.zip"

      - name: Remove the previous test build's release
        if: env.IS_TRANSIENT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release delete ${{ env.RELEASE_TAG }} --yes --cleanup-tag 2>$null
          exit 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = "Needs the .NET 10 Desktop Runtime (x86): https://dotnet.microsoft.com/download/dotnet/10.0`n`nUnzip anywhere and run DBZKit.exe, Dragon Radar.exe or Legacy.exe."
          $flags = @()
          if ($env:IS_TRANSIENT -eq 'true') { $flags += '--prerelease' }
          gh release create ${{ env.RELEASE_TAG }} "DBZKit-${{ env.RELEASE_TAG }}.zip" `
            --title "${{ env.RELEASE_TAG }}" --notes $notes --generate-notes @flags
