name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DBZKit.slnx

      - name: Publish DBZKit
        run: dotnet publish DBZKit/DBZKit.csproj -c Release -p:Platform=x86 -r win-x86 --self-contained false -o publish/DBZKit

      - name: Publish Dragon Radar
        run: dotnet publish "Dragon Radar/Dragon Radar.csproj" -c Release -o publish/DragonRadar

      - name: Publish Legacy
        run: dotnet publish Legacy/Legacy.csproj -c Release -p:Platform=x86 -r win-x86 --self-contained false -o publish/Legacy

      - name: Zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path publish/DBZKit/* -DestinationPath DBZKit-${{ github.ref_name }}.zip
          Compress-Archive -Path publish/DragonRadar/* -DestinationPath DragonRadar-${{ github.ref_name }}.zip
          Compress-Archive -Path publish/Legacy/* -DestinationPath Legacy-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} `
            DBZKit-${{ github.ref_name }}.zip `
            DragonRadar-${{ github.ref_name }}.zip `
            Legacy-${{ github.ref_name }}.zip `
            --title "${{ github.ref_name }}" `
            --generate-notes
